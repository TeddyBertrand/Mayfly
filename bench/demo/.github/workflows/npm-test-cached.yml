name: npm-test-cached
run-name: npm-test-cached on ${{ inputs.runner }}
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner type to run on
        type: choice
        options: [hosted, mayfly, classic]
        default: hosted

permissions:
  contents: read

jobs:
  test:
    # The one switch between runner types; everything below is identical on all of them.
    runs-on: ${{ fromJSON('{"hosted":"ubuntu-24.04","mayfly":["self-hosted","mayfly"],"classic":["self-hosted","classic"]}')[inputs.runner] }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      # Same work as npm-test, with the npm download cache restored and saved through actions/cache.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm test

name: close-issues

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Close issues referenced with a closing keyword
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The body is untrusted input, so it goes through env, never into the script text.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          numbers=$(printf '%s\n' "$PR_BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+$' | sort -un || true)
          if [ -z "$numbers" ]; then
            echo "No closing keywords found."
            exit 0
          fi
          for n in $numbers; do
            info=$(gh api "repos/$GH_REPO/issues/$n" --jq '[.state, (.pull_request != null)] | @tsv' 2>/dev/null) || { echo "#$n not found, skipping"; continue; }
            state=${info%%$'\t'*}
            is_pr=${info##*$'\t'}
            if [ "$is_pr" = "true" ]; then
              echo "#$n is a pull request, skipping"
            elif [ "$state" = "closed" ]; then
              echo "#$n already closed"
            else
              gh issue close "$n" --comment "Done in #$PR_NUMBER"
            fi
          done

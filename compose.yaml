# Mayfly deploy unit (issue #80, decisions 014 and 015). Settings come from .env, see .env.example.
name: mayfly

x-common: &common
  image: ghcr.io/teddybertrand/mayfly:${MAYFLY_VERSION:-dev}
  restart: unless-stopped
  # Host UID so the 600 secret files stay readable; the docker GID grants socket access.
  user: "${MAYFLY_UID:?set MAYFLY_UID in .env}:${MAYFLY_UID}"
  group_add:
    - "${DOCKER_GID:?set DOCKER_GID in .env}"
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
  secrets: [app_key]
  environment: &env
    MAYFLY_APP_ID: ${MAYFLY_APP_ID:?set MAYFLY_APP_ID in .env}
    MAYFLY_APP_KEY_FILE: /run/secrets/app_key
    MAYFLY_RUNNER_LABELS: ${MAYFLY_RUNNER_LABELS:-mayfly}
    MAYFLY_WORKER_NETWORK: mayfly-workers
    MAYFLY_WORKER_TIMEOUT: ${MAYFLY_WORKER_TIMEOUT:-6h}

services:
  mayfly:
    <<: *common
    build:
      context: .
      args:
        VERSION: ${MAYFLY_VERSION:-dev}
    secrets: [app_key, webhook_secret]
    environment:
      <<: *env
      MAYFLY_LISTEN_ADDR: ":8080"
      # Ops endpoints (/healthz, /metrics) for the reaper and Prometheus over the Compose network; never published (decision 018).
      MAYFLY_OPS_ADDR: ":8081"
      MAYFLY_WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      MAYFLY_WORKERS: ${MAYFLY_WORKERS:-2}
      MAYFLY_QUEUE_SIZE: ${MAYFLY_QUEUE_SIZE:-100}
    ports:
      - "${MAYFLY_PUBLISH:-127.0.0.1:8080}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/mayfly", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Long enough for mayfly to remove its running workers on SIGTERM.
    stop_grace_period: 1m

  reaper:
    <<: *common
    entrypoint: ["/usr/local/bin/reaper"]
    environment:
      <<: *env
      MAYFLY_HEALTH_URL: http://mayfly:8081/healthz
      MAYFLY_REAPER_INTERVAL: ${MAYFLY_REAPER_INTERVAL:-1m}
      # The reaper's own /metrics for Prometheus over the Compose network; never published (decision 020).
      MAYFLY_REAPER_OPS_ADDR: ":8082"
    depends_on:
      mayfly:
        condition: service_healthy

  # Scrapes mayfly:8081 and reaper:8082 over the Compose network; never published (decision 021).
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      # Caps disk use on the 32 GB OS disk, which also holds worker images.
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Dashboards from the repo; loopback only, reached on the VM through an SSH tunnel (decision 021).
  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    environment:
      # Anonymous read-only access and no login form: safe only because the port is on loopback.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GRAFANA_ROLE:-Viewer}
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/mayfly.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # Keep it on loopback: anyone who reaches this port sees the dashboards without logging in.
      - "${GRAFANA_PUBLISH:-127.0.0.1:3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # About 230 MB in use plus cache when idle; headroom for heavier dashboards.
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy

  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:20241", "--url", "http://mayfly:8080"]
    ports:
      - "127.0.0.1:20241:20241"
    depends_on:
      mayfly:
        condition: service_healthy

  # Public HTTPS entry on the cloud host (decision 016); Let's Encrypt certificate for MAYFLY_DOMAIN.
  # Not `:?`: Compose interpolates every service, even ones whose profile is off.
  caddy:
    profiles: [cloud]
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${MAYFLY_DOMAIN:-}", "--to", "mayfly:8080"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      mayfly:
        condition: service_healthy

volumes:
  caddy_data:
  prometheus_data:
  grafana_data:

secrets:
  app_key:
    file: ${MAYFLY_APP_KEY_PATH:?set MAYFLY_APP_KEY_PATH in .env}
  webhook_secret:
    file: ${MAYFLY_WEBHOOK_SECRET_PATH:?set MAYFLY_WEBHOOK_SECRET_PATH in .env}
